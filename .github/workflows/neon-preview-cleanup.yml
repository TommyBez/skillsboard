name: Cleanup Neon preview branch

# When a same-repository PR is closed, merged or not, delete the Neon database
# branch that the Neon <> Vercel integration created for its preview
# deployments (named `preview/<git-branch>`). Creation stays with Vercel.
#
# Requires the Neon GitHub App connected to this repo, which sets:
#   - repository variable NEON_PROJECT_ID
#   - repository secret  NEON_API_KEY
#
# `pull_request_target` also receives close events for PRs with merge
# conflicts and runs this trusted default-branch workflow. Never check out
# or execute PR code here. Fork PRs are skipped before the secret is exposed.

on:
  pull_request_target:
    types: [closed]

permissions: {}

jobs:
  delete-neon-branch:
    name: Delete Neon preview branch
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Delete branch preview/${{ github.event.pull_request.head.ref }}
        uses: neondatabase/delete-branch-action@v3
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch: preview/${{ github.event.pull_request.head.ref }}
          api_key: ${{ secrets.NEON_API_KEY }}
