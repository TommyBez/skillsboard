<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title description">
  <title id="title">Skills Board product demo</title>
  <desc id="description">Alex saves a team recommendation. Sam finds and uses it.</desc>
  <rect width="1440" height="900" fill="#f4f3e9"/>
  <circle cx="1215" cy="164" r="330" fill="#dcebd9"/>
  <rect x="72" y="62" width="58" height="58" rx="10" fill="#05843f"/>
  <text x="101" y="106" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="800" fill="#ffffff">S</text>
  <text x="151" y="102" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#071a10">Skills Board</text>
  <text x="76" y="274" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" letter-spacing="3" fill="#05843f">PRODUCT DEMO</text>
  <text x="72" y="392" font-family="Arial, Helvetica, sans-serif" font-size="78" font-weight="700" letter-spacing="-3" fill="#071a10">One recommendation.</text>
  <text x="72" y="480" font-family="Arial, Helvetica, sans-serif" font-size="78" font-weight="700" letter-spacing="-3" fill="#071a10">Shared with the team.</text>
  <text x="76" y="580" font-family="Arial, Helvetica, sans-serif" font-size="31" fill="#506058">Alex saves a useful skill. Sam finds it and chooses how to use it.</text>
  <line x1="76" y1="702" x2="1364" y2="702" stroke="#cbd2c6" stroke-width="2"/>
  <text x="76" y="759" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#071a10">01 · SAVE</text>
  <text x="468" y="759" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#071a10">02 · FIND</text>
  <text x="830" y="759" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#071a10">03 · USE</text>
  <text x="76" y="818" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#657169">Demo data only. No customer information.</text>
</svg>
